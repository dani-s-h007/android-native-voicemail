; ==============================================================================
; File: telephony/extensions.conf
; Description: Production Asterisk dialplan with dynamic DND greeting,
;              DPDP consent notice, RAM-disk recording, and webhook notification
; ==============================================================================

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
RECORDINGS_DIR=/var/spool/voicemail_relay/ephemeral
GREETINGS_DIR=/var/spool/voicemail_relay/greetings
MAX_RECORD_DURATION=120
SILENCE_TIMEOUT=4

[from-carrier]
exten => _.,1,NoOp(================ INBOUND FORWARDED CALL ===============)
 same => n,Set(CALL_START_TIME=${EPOCH})
 same => n,Set(SESSION_ID=${UNIQUEID})
 same => n,Set(RAW_CALLER_NUM=${CALLERID(num)})

 ; Step 1: Normalize Caller ID (+91 format)
 same => n,Set(CALLER_DIGITS=${FILTER(0123456789,${RAW_CALLER_NUM})})
 same => n,ExecIf($[${LEN(${CALLER_DIGITS})} = 10]?Set(CALLER_DIGITS=91${CALLER_DIGITS}))
 same => n,Set(CALLER_NUMBER=+${CALLER_DIGITS})
 same => n,NoOp(Normalized Caller Number: ${CALLER_NUMBER})

 ; Step 2: Extract Diverted User Phone Number
 same => n,Gosub(sub-extract-user,s,1)
 same => n,Set(DIVERTED_USER=${GOSUB_RETVAL})
 same => n,NoOp(Diverted User Destination: ${DIVERTED_USER})

 ; Step 3: Handle Unknown Direct Callers
 same => n,GotoIf($["${DIVERTED_USER}" = "UNKNOWN"]?handle_unknown)

 ; Step 4: Answer Call
 same => n,Answer(500)
 same => n,Wait(0.5)

 ; Step 5: Check for Active DND Custom Greeting in RAM
 same => n,Set(CUSTOM_GREETING=${GREETINGS_DIR}/${DIVERTED_USER})
 same => n,GotoIf($[${STAT(e,${CUSTOM_GREETING}.wav)} = 1]?play_dnd_greeting:play_standard_consent)

 same => n(play_dnd_greeting),NoOp(Playing Custom DND Greeting for ${DIVERTED_USER})
 same => n,Playback(${CUSTOM_GREETING})
 same => n,Goto(play_beep)

 same => n(play_standard_consent),NoOp(Playing Standard DPDP Recording Consent Prompt)
 same => n,Playback(/var/lib/asterisk/sounds/en/voicemail_consent_prompt)
 same => n,Goto(play_beep)

 ; Step 6: Beep Tone
 same => n(play_beep),Playtones(beep)
 same => n,Wait(0.4)
 same => n,StopPlaytones()

 ; Step 7: Record Audio (16kHz Mono WAV directly to RAM disk)
 same => n,Set(REC_FILE=${RECORDINGS_DIR}/${SESSION_ID})
 same => n,Record(${REC_FILE}:wav,${SILENCE_TIMEOUT},${MAX_RECORD_DURATION},k)

 ; Step 8: Hangup
 same => n,Hangup()

 same => n(handle_unknown),NoOp(Rejected: Direct call without SIP diversion metadata)
 same => n,Answer(500)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; ------------------------------------------------------------------------------
; Hangup Handler: Dispatches ephemeral delivery or shreds ghost recordings
; ------------------------------------------------------------------------------
exten => h,1,NoOp(--- Hangup Handler: Processing Ephemeral Recording ---)
 same => n,GotoIf($["${DIVERTED_USER}" = "UNKNOWN" | "${DIVERTED_USER}" = ""]?skip_hook)
 same => n,Set(TOTAL_DURATION=$[${EPOCH} - ${CALL_START_TIME}])
 same => n,GotoIf($[${TOTAL_DURATION} < 2]?cleanup_ghost)

 ; Dispatch webhook to FastAPI relay backend in detached background process
 same => n,System(/usr/bin/python3 /var/lib/asterisk/agi-bin/notify_relay.py --session "${SESSION_ID}" --user "${DIVERTED_USER}" --caller "${CALLER_NUMBER}" --filepath "${RECORDINGS_DIR}/${SESSION_ID}.wav" --duration "${TOTAL_DURATION}" --reason "${FORWARD_REASON}" &)
 same => n,Return()

 same => n(cleanup_ghost),NoOp(Discarding audio file for ghost call < 2 seconds)
 same => n,System(rm -f ${RECORDINGS_DIR}/${SESSION_ID}.wav)
 same => n,Return()

 same => n(skip_hook),NoOp(No valid recipient. File dropped.)
 same => n,Return()

; ------------------------------------------------------------------------------
; Subroutine: Extract Diverted User from SIP Diversion or History-Info
; ------------------------------------------------------------------------------
[sub-extract-user]
exten => s,1,NoOp(--- Parsing Diversion and History-Info Headers ---)
 same => n,Set(DIVERTED_USER=UNKNOWN)
 same => n,Set(FORWARD_REASON=unknown)

 same => n,Set(DIVERSION_HDR=${PJSIP_HEADER(read,Diversion)})
 same => n,ExecIf($["${DIVERSION_HDR}" != ""]?Set(EXTRACTED_RAW=${REGEX("sip:(\+?[0-9]+)@" ${DIVERSION_HDR} 1)}))
 same => n,ExecIf($["${DIVERSION_HDR}" != ""]?Set(FORWARD_REASON=${REGEX("reason=([a-zA-Z\-]+)" ${DIVERSION_HDR} 1)}))

 same => n,GotoIf($["${EXTRACTED_RAW}" != ""]?parse_digits)
 same => n,Set(HISTORY_HDR=${PJSIP_HEADER(read,History-Info)})
 same => n,ExecIf($["${HISTORY_HDR}" != ""]?Set(EXTRACTED_RAW=${REGEX("sip:(\+?[0-9]+)@" ${HISTORY_HDR} 1)}))

 same => n(parse_digits),GotoIf($["${EXTRACTED_RAW}" = ""]?return_val)
 same => n,Set(CLEAN_USER=${FILTER(0123456789,${EXTRACTED_RAW})})
 same => n,ExecIf($[${LEN(${CLEAN_USER})} = 10]?Set(CLEAN_USER=91${CLEAN_USER}))
 same => n,ExecIf($[${LEN(${CLEAN_USER})} = 11 & "${CLEAN_USER:0:1}" = "0"]?Set(CLEAN_USER=91${CLEAN_USER:1}))
 same => n,Set(DIVERTED_USER=+${CLEAN_USER})

 same => n(return_val),Return(${DIVERTED_USER})
