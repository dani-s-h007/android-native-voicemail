; ==============================================================================
; File: telephony/pjsip.conf
; Description: Production PJSIP configuration for Indian SIP Trunk
; ==============================================================================

[global]
type=global
user_agent=Enterprise-Voicemail-PBX
default_realm=telephony.yourdomain.com

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
verify_client=no
verify_server=no

[trunk-indian-provider]
type=endpoint
transport=transport-udp
context=from-carrier
disallow=all
allow=alaw
allow=ulaw
allow=opus
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
direct_media=no
media_encryption=no
send_diversion=yes
inband_progress=yes
dtmf_mode=rfc4733
language=en

[trunk-indian-provider-identify]
type=identify
endpoint=trunk-indian-provider
match=182.76.0.0/16
match=115.112.0.0/16
match=122.160.0.0/16

